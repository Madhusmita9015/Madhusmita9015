<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 252" width="900" height="252" role="img" aria-labelledby="t d"><title id="t">Leadership</title><desc id="d">General Secretary of the IEEE Student Branch at Amity University Rajasthan since January 2025. Organizer of Whack Hackathon 4.0, February 2026, with 30+ teams and 500+ attendees. Team Member, National Service Scheme.</desc><defs><pattern id="s" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="1" height="10" fill="#526B53" fill-opacity="0.08"/></pattern></defs><rect width="900" height="252" fill="#F5F3E5"/><rect width="900" height="252" fill="url(#s)"/><rect x="0" y="0" width="1" height="252" fill="#BEC1AA"/><rect x="899" y="0" width="1" height="252" fill="#BEC1AA"/><rect x="0" y="0" width="4" height="252" fill="#77916F"/><rect x="0" y="83" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><rect x="0" y="167" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><text x="28" y="38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#526B53">JAN 2025 – PRESENT</text><text x="250" y="38" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="21" fill="#191A16" >General Secretary</text><text x="250" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#526B53" >IEEE Student Branch, Amity University Rajasthan</text><text x="28" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#526B53">FEB 2026</text><text x="250" y="122" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="21" fill="#191A16" >Organizer, Whack Hackathon 4.0</text><text x="250" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#526B53" >National-level, 24 hours · 30+ teams, 500+ attendees</text><text x="28" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-