<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" role="img" aria-labelledby="t d"><title id="t">Technical Toolkit</title><desc id="d">Languages, AI and data, backend, frontend, databases and engineering practices. Languages: Python, Java, C++, C, SQL, JavaScript (ES6), TypeScript. Ai &amp; Data: Machine learning, NLP, Generative AI, LLM API integration, prompt engineering, RAG fundamentals; Pandas, NumPy, Matplotlib, Scikit-learn, MediaPipe. Backend: FastAPI, Flask, REST APIs, Streamlit. Frontend: React.js, Vite, Tailwind CSS, HTML5, CSS3, Three.js. Databases: MySQL, PostgreSQL, SQLite, MongoDB. Practices: OOP, DSA, async/await, unit testing, error handling and logging, Git workflows.</desc><defs><pattern id="s" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="1" height="10" fill="#526B53" fill-opacity="0.08"/></pattern></defs><rect width="900" height="358" fill="#F5F3E5"/><rect width="900" height="358" fill="url(#s)"/><rect x="0" y="0" width="1" height="358" fill="#BEC1AA"/><rect x="899" y="0" width="1" height="358" fill="#BEC1AA"/><rect x="0" y="0" width="4" height="358" fill="#77916F"/><rect x="0" y="55" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><rect x="0" y="133" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><rect x="0" y="189" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><rect x="0" y="245" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><rect x="0" y="301" width="900" height="1" fill="#526B53" fill-opacity="0.4"/><rect x="0" y="356" width="900" height="2" fill="#526B53"/><text x="28" y="33" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#526B53">LANGUAGES</text><text x="250" y="33" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#191A16" >Python, Java, C++, C, SQL, JavaScript (ES6), TypeScript</text><text x="28" y="89" font-family="'Helvetica Neue', Helvetica, Arial,